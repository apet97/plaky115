name: Release npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: cli/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true

      - name: Validate tag and package metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/check-release-version.mjs --tag "${RELEASE_TAG}" --offline

      - name: Install dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix mcp-server ci
          cd cli && go mod download

      - name: Run complete release gate
        run: npm run verify

      - name: Inspect SDK pack
        run: npm --prefix sdk pack --dry-run --json

      - name: Inspect MCP pack
        run: npm --prefix mcp-server pack --dry-run --json

      - name: Audit package artifacts
        run: |
          npm run artifacts:audit
          npm run pack:smoke
          npm run package:consumer-smoke

      - name: Require unpublished exact versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/check-release-version.mjs --tag "${RELEASE_TAG}" --registry-preflight

      - name: Publish SDK
        run: (cd sdk && npm publish --access public)

      - name: Publish MCP server
        run: (cd mcp-server && npm publish --access public)
