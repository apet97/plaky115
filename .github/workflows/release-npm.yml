name: Release npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to the triggering tag
        shell: bash
        run: |
          semver_tag='^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${GITHUB_REF}" =~ ${semver_tag} ]]
          version="${GITHUB_REF#refs/tags/v}"
          if [[ "${version}" == *-* ]]; then
            prerelease="${version#*-}"; prerelease="${prerelease%%+*}"
            IFS=. read -r -a identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do [[ ! "${identifier}" =~ ^0[0-9]+$ ]]; done
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "${head_commit}" = "${tag_commit}"
          test "${head_commit}" = "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.16.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.2"
          install-only: true

      - name: Validate tag and package metadata
        run: node scripts/check-release-version.mjs --tag "${GITHUB_REF_NAME}" --offline

      - name: Install dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix mcp-server ci
          cd cli && go mod download

      - name: Run complete release gate
        run: |
          npm run audit:production
          npm run govulncheck
          npm run verify

      - name: Build, inspect, and bind exact npm artifacts
        run: |
          node scripts/pack-release-artifacts.mjs --pack \
            --output .release-artifacts \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}"
          node scripts/pack-release-artifacts.mjs --verify --manifest .release-artifacts/release-digests.json
          node scripts/pack-release-artifacts.mjs --install --manifest .release-artifacts/release-digests.json
          node scripts/package-consumer-smoke.mjs --artifacts-manifest .release-artifacts/release-digests.json

      - name: Prove deterministic packs in two clean checkouts
        run: node scripts/check-release-determinism.mjs

      - name: Require trusted publisher configuration readback
        env:
          PLAKY115_RELEASE_CONFIG_READBACK: ${{ vars.PLAKY115_RELEASE_CONFIG_READBACK }}
        run: node scripts/write-release-evidence.mjs --check-readback

      - name: Classify registry and publish exact artifacts
        run: >-
          node scripts/publish-npm-release.mjs
          --manifest .release-artifacts/release-digests.json
          --tag "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}" > .release-artifacts/publication.json

      - name: Emit sanitized release evidence
        env:
          PLAKY115_RELEASE_CONFIG_READBACK: ${{ vars.PLAKY115_RELEASE_CONFIG_READBACK }}
        run: node scripts/write-release-evidence.mjs \
          --manifest .release-artifacts/release-digests.json \
          --publication .release-artifacts/publication.json \
          --output .release-artifacts/release-evidence.json \
          --cli-status pass

      - name: Upload npm release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-evidence
          path: .release-artifacts/
          if-no-files-found: error
          retention-days: 30
