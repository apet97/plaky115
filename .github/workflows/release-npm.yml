name: Release npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to the triggering tag
        shell: bash
        run: |
          semver_tag='^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "${GITHUB_REF}" =~ ${semver_tag} ]]
          version="${GITHUB_REF#refs/tags/v}"
          if [[ "${version}" == *-* ]]; then
            prerelease="${version#*-}"; prerelease="${prerelease%%+*}"
            IFS=. read -r -a identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do [[ ! "${identifier}" =~ ^0[0-9]+$ ]]; done
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "${head_commit}" = "${tag_commit}"
          test "${head_commit}" = "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.16.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.2"
          install-only: true

      - name: Validate tag and package metadata
        run: node scripts/check-release-version.mjs --tag "${GITHUB_REF_NAME}" --offline

      - name: Install dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix mcp-server ci
          cd cli && go mod download

      - name: Run complete release gate
        run: |
          npm run audit:production
          npm run govulncheck
          npm run verify

      - name: Inspect SDK pack
        run: (cd sdk && npm pack --dry-run --json)

      - name: Inspect MCP pack
        run: (cd mcp-server && npm pack --dry-run --json)

      - name: Audit package artifacts
        run: |
          npm run artifacts:audit
          npm run pack:smoke
          npm run package:consumer-smoke

      - name: Require unpublished exact versions
        run: node scripts/check-release-version.mjs --tag "${GITHUB_REF_NAME}" --registry-preflight

      - name: Publish SDK
        run: (cd sdk && npm publish --access public)

      - name: Publish MCP server
        run: (cd mcp-server && npm publish --access public)
