name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.2"
          install-only: true
      - name: Install dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix mcp-server ci
          cd cli && go mod download
      - name: Verify contracts, generation, security, and release policy
        run: npm run verify
      - name: Verify production dependencies and Go vulnerabilities
        run: |
          npm run audit:production
          npm run govulncheck

  node-compatibility:
    name: Node ${{ matrix.node-version }} packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"
      - run: npm --prefix sdk ci
      - run: npm --prefix mcp-server ci
      - run: npm --prefix sdk run typecheck && npm --prefix sdk run test:types && npm --prefix sdk run lint && npm --prefix sdk test
      - run: npm --prefix mcp-server run lint && npm --prefix mcp-server test
      - run: npm run package:consumer-smoke

  macos-cli:
    name: macOS CLI and installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - run: cd cli && go test ./... && go build -o "$RUNNER_TEMP/plaky115" ./cmd/plaky115 && "$RUNNER_TEMP/plaky115" --help >/dev/null
      - run: npm run installer:test

  windows-cli:
    name: Windows CLI and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - shell: pwsh
        run: |
          cd cli
          go test ./...
          go build -o "$env:RUNNER_TEMP\plaky115.exe" ./cmd/plaky115
          & "$env:RUNNER_TEMP\plaky115.exe" --help | Out-Null
          [void][scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))
      - name: Smoke checksum-verified PowerShell installer
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "installer-fixture"
          $release = Join-Path $fixture "v0.2.1"
          $payload = Join-Path $env:RUNNER_TEMP "installer-payload"
          $install = Join-Path $env:RUNNER_TEMP "install with spaces"
          New-Item -ItemType Directory -Force -Path @($release, $payload, $install) | Out-Null
          Set-Content -NoNewline -Path (Join-Path $payload "plaky115.exe") -Value "verified binary"
          $archive = Join-Path $release "plaky115_Windows_x86_64.zip"
          Compress-Archive -Path (Join-Path $payload "plaky115.exe") -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $release "checksums.txt") -Value "$hash  plaky115_Windows_x86_64.zip"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", $fixture -PassThru
          try {
            $env:PLAKY115_VERSION = "v0.2.1"
            $env:PLAKY115_INSTALL_DIR = $install
            $env:PLAKY115_INSTALL_TESTING = "1"
            $env:PLAKY115_INSTALL_TEST_BASE_URL = "http://127.0.0.1:8765"
            Start-Sleep -Seconds 2
            & ./cli/scripts/install.ps1
            if ((Get-Content (Join-Path $install "plaky115.exe") -Raw) -ne "verified binary") { throw "installed binary mismatch" }

            Set-Content -NoNewline -Path (Join-Path $install "plaky115.exe") -Value "existing binary"
            Set-Content -Path (Join-Path $release "checksums.txt") -Value "$('0' * 64)  plaky115_Windows_x86_64.zip"
            try { & ./cli/scripts/install.ps1; $checksumRejected = $false } catch { $checksumRejected = $_.Exception.Message -match "checksum mismatch" }
            if (-not $checksumRejected) { throw "checksum mismatch was not rejected" }
            if ((Get-Content (Join-Path $install "plaky115.exe") -Raw) -ne "existing binary") { throw "checksum failure replaced existing binary" }

            Remove-Item $archive -Force
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::Open($archive, [IO.Compression.ZipArchiveMode]::Create)
            try {
              $entry = $zip.CreateEntry("../escape.exe")
              $writer = [IO.StreamWriter]::new($entry.Open())
              try { $writer.Write("escape") } finally { $writer.Dispose() }
            } finally { $zip.Dispose() }
            $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            Set-Content -Path (Join-Path $release "checksums.txt") -Value "$hash  plaky115_Windows_x86_64.zip"
            try { & ./cli/scripts/install.ps1; $traversalRejected = $false } catch { $traversalRejected = $_.Exception.Message -match "unsafe path" }
            if (-not $traversalRejected) { throw "archive traversal was not rejected" }
            if ((Get-Content (Join-Path $install "plaky115.exe") -Raw) -ne "existing binary") { throw "traversal failure replaced existing binary" }

            Remove-Item $archive -Force
            Compress-Archive -Path (Join-Path $payload "plaky115.exe") -DestinationPath $archive
            $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            Set-Content -Path (Join-Path $release "checksums.txt") -Value "$hash  plaky115_Windows_x86_64.zip"
            $env:PLAKY115_INSTALL_TEST_FAIL_REPLACE = "1"
            try { & ./cli/scripts/install.ps1; $rollbackExercised = $false } catch { $rollbackExercised = $_.Exception.Message -match "simulated atomic replacement failure" }
            if (-not $rollbackExercised) { throw "replacement failure was not exercised" }
            if ((Get-Content (Join-Path $install "plaky115.exe") -Raw) -ne "existing binary") { throw "replacement failure did not restore existing binary" }

            $env:PLAKY115_INSTALL_TEST_FAIL_RESTORE = "1"
            try { & ./cli/scripts/install.ps1; $restoreFailureExercised = $false } catch { $restoreFailureExercised = $_.Exception.Message -match "recovery backup preserved" }
            if (-not $restoreFailureExercised) { throw "restore failure was not preserved" }
            $backups = @(Get-ChildItem -LiteralPath $install -Filter ".plaky115.backup.*")
            if ($backups.Count -ne 1) { throw "recovery backup was not preserved" }
            if ((Get-Content $backups[0].FullName -Raw) -ne "existing binary") { throw "preserved recovery backup contents changed" }
          } finally { Stop-Process $server -Force }
