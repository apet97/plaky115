name: Live read contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 2"

permissions:
  contents: read

jobs:
  read:
    environment: live-read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm --prefix sdk ci
      - run: npm --prefix sdk run build
      - name: Run sanitized GET-only sweep
        env:
          PLAKY115_API_KEY: ${{ secrets.PLAKY115_READ_API_KEY }}
          PLAKY115_BASE_URL: ${{ vars.PLAKY115_BASE_URL }}
        run: node scripts/live-read-sweep.mjs
