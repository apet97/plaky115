name: Manual Live Sweep

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Sacrificial Plaky space ID"
        required: true
      board_id:
        description: "Sacrificial Plaky board ID"
        required: true
      allow_archive:
        description: "Acknowledge empty-group archive/delete probes on this sacrificial board"
        required: true
        type: boolean
        default: false
      group_title:
        description: "Writable group title"
        required: false
        default: "Backlog"

concurrency:
  group: live-${{ inputs.space_id }}-${{ inputs.board_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    environment: live-read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.17"
      - name: Install dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix mcp-server ci
      - name: Build live sweep packages
        run: |
          npm --prefix sdk run build
          npm --prefix mcp-server run build
      - name: Check live sweep guardrails
        run: npm run live:sweep:test
      - name: Run live sweep
        env:
          PLAKY115_API_KEY: ${{ secrets.PLAKY115_READ_API_KEY }}
          PLAKY115_BASE_URL: ${{ vars.PLAKY115_BASE_URL }}
          PLAKY115_SMOKE_SPACE_ID: ${{ inputs.space_id }}
          PLAKY115_SMOKE_BOARD_ID: ${{ inputs.board_id }}
          PLAKY115_SMOKE_ALLOW_ARCHIVE: ${{ inputs.allow_archive && '1' || '0' }}
          PLAKY115_SMOKE_GROUP_TITLE: ${{ inputs.group_title }}
        run: npm run live:sweep
