openapi: 3.1.0
info: { title: Metadata multipart fixture, version: 1.0.0 }
paths:
  /fixture/widgets/{widgetId}/files:
    post:
      operationId: fixtureUploadWidgetFile
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
components:
  schemas:
    File:
      type: object
      properties:
        id: { type: integer, format: int64 }
