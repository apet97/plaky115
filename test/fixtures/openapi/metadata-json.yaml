openapi: 3.1.0
info: { title: Metadata JSON fixture, version: 1.0.0 }
paths:
  /fixture/widgets/{widgetId}:
    post:
      operationId: fixtureCreateWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: labels
          in: query
          required: false
          description: Labels used to filter fixture widgets.
          style: form
          explode: true
          schema:
            type: array
            default: [alpha]
            items:
              type: string
              enum: [alpha, beta]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
components:
  schemas:
    WidgetInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
    Widget:
      type: object
      properties:
        id: { type: integer, format: int64 }
